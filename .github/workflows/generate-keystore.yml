name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key Alias'
        required: true
        default: 'upload'
      validity_years:
        description: 'Validity in Years'
        required: true
        default: '30'
      organization_name:
        description: 'Organization Name (O)'
        required: false
        default: 'AI Studio Org'
      common_name:
        description: 'Common Name (CN)'
        required: false
        default: 'Android Release Key'

jobs:
  create-keystore:
    name: Generate Production Upload Keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Keystore
        id: generate
        run: |
          DAYS=$(( ${{ inputs.validity_years }} * 365 ))
          # Generate strong random passwords
          PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 20)
          
          KEYSTORE_FILE="upload-keystore.jks"
          
          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$DAYS" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=${{ inputs.common_name }}, OU=Mobile, O=${{ inputs.organization_name }}, L=Mountain View, ST=CA, C=US"
          
          # Base64 encode the keystore (single line)
          B64_KEY=$(base64 -w 0 "$KEYSTORE_FILE" 2>/dev/null || base64 "$KEYSTORE_FILE" | tr -d '\n')
          
          echo "::add-mask::$PASS"
          echo "::add-mask::$B64_KEY"
          
          echo "STORE_PASS=$PASS" >> $GITHUB_OUTPUT
          echo "KEYSTORE_B64=$B64_KEY" >> $GITHUB_OUTPUT
          
          # Output instructions into Job Summary (Markdown)
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 🔑 Production Keystore Generated Successfully!
          
          Follow these steps to store your keystore in GitHub Repository Secrets:
          
          1. Go to your repository on GitHub.
          2. Navigate to **Settings** > **Secrets and variables** > **Actions**.
          3. Click **New repository secret** and add the following secrets:
          
          | Secret Name | Description |
          |---|---|
          | `KEYSTORE_BASE64` | The Base64 string of your `.jks` file (downloaded from artifacts or run logs) |
          | `STORE_PASSWORD` | The store password used to encrypt the keystore |
          | `KEY_PASSWORD` | The key password (identical to `STORE_PASSWORD`) |
          | `KEY_ALIAS` | `${{ inputs.key_alias }}` |
          
          > ⚠️ **CRITICAL BACKUP RULE**: Download the `upload-keystore.jks` artifact and store it in an offline password manager / secure vault (like 1Password, Bitwarden, or Google Cloud Secret Manager). If lost, Google Play will not allow you to update your app!
          EOF

      - name: Upload Keystore Artifact (Zip protected)
        uses: actions/upload-artifact@v4
        with:
          name: generated-upload-keystore
          path: upload-keystore.jks
          retention-days: 1
