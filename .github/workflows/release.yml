name: Android Release & Keystore Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build Signed Release APK'
        required: true
        type: boolean
        default: true
      build_aab:
        description: 'Build Signed Release AAB (Google Play Bundle)'
        required: true
        type: boolean
        default: true
      release_notes:
        description: 'Release Notes (Markdown)'
        required: false
        type: string
        default: 'Production release artifact generated via automated GitHub CI/CD.'

permissions:
  contents: write

jobs:
  release:
    name: Build & Sign Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Secrets Configuration (.env)
        env:
          ENV_SECRET: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_SECRET" ]; then
            echo "$ENV_SECRET" > .env
          elif [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Setup Release Keystore
        id: keystore_setup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          KEYSTORE_FILE="$GITHUB_WORKSPACE/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "STORE_PASSWORD=${STORE_PASSWORD_SECRET}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET:-$STORE_PASSWORD_SECRET}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${KEY_ALIAS_SECRET:-upload}" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "keystore_source=secret" >> $GITHUB_OUTPUT
          else
            echo "::warning::KEYSTORE_BASE64 secret not found. Generating ephemeral upload keystore for CI build validation..."
            AUTO_PASS="AndroidKeystoreCI2026!"
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "upload" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$AUTO_PASS" \
              -keypass "$AUTO_PASS" \
              -dname "CN=CI Release, OU=Build, O=AI Studio, L=Mountain View, ST=CA, C=US"
            
            echo "STORE_PASSWORD=$AUTO_PASS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$AUTO_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "keystore_source=ephemeral" >> $GITHUB_OUTPUT
            echo "::notice::Ephemeral keystore generated for this run. To use your official signing key, set KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD secrets in your GitHub repository."
          fi

      - name: Make Gradlew Executable
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found. Generating wrapper with gradle..."
            gradle wrapper || true
          fi
          chmod +x ./gradlew || true

      - name: Build Release APK
        if: ${{ github.event_name == 'push' || inputs.build_apk }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Build Release App Bundle (AAB)
        if: ${{ github.event_name == 'push' || inputs.build_aab }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew bundleRelease --stacktrace
          else
            gradle bundleRelease --stacktrace
          fi

      - name: Upload Release APK Artifact
        if: ${{ github.event_name == 'push' || inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB Artifact
        if: ${{ github.event_name == 'push' || inputs.build_aab }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Proguard Mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          body: |
            ## Release ${{ github.ref_name }}

            ${{ inputs.release_notes || 'Automated production build artifacts created by GitHub Actions.' }}

            ### Artifacts:
            - **APK (Direct Install)**: `app/build/outputs/apk/release/*.apk`
            - **AAB (Google Play Console)**: `app/build/outputs/bundle/release/*.aab`
          draft: false
          prerelease: false
