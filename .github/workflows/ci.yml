name: Android CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Prepare Secrets Configuration (.env)
        run: |
          if [ ! -f .env ]; then
            echo "Creating .env from .env.example for build..."
            cp .env.example .env
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew || true

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify Roborazzi Screenshot Tests
        run: ./gradlew verifyRoborazziDebug --stacktrace
        continue-on-error: false

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
          retention-days: 7

      - name: Upload Roborazzi Screenshot Diffs (On Test Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshot-diffs
          path: |
            app/build/outputs/roborazzi/
          retention-days: 7

  build-debug:
    name: Build Debug APK
    needs: test-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Secrets Configuration (.env)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew || true

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
